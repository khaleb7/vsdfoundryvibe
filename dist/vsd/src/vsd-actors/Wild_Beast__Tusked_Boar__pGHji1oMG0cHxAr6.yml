  - name: Common Opponent
    type: Trait
    system:
      notes: >-
        Usually defeated at CMB/2, Seriously Injured or Severe Bleeding, or
        Bruised.


        Common Opponents may be considered defeated if the penalties they’re
        suffering from are equal to or greater than half their CMB or -50
        (equivalent to a Serious Injury), whichever is higher; they’re Bruised
        (wounded for more than half their HPs); or suffering from Severe
        Bleeding.

        Furthermore, if a group of Common Opponents are facing the PCs, the GM
        may decide they would try to flee, surrender, or whatever other means of
        avoiding combat if half their original number is disabled, killed, or
        defeated without significant losses for the opposing party.
