    text-decoration-thickness: initial; text-decoration-style: initial;
    text-decoration-color: initial;"><span style="font-family: 'Sabon LT
    Std'">Description</span></h1><p style="box-sizing: border-box; user-select:
    text; margin: 0.5em 0px; color: rgb(0, 0, 0); font-family: 'Sabon LT Std';
    font-size: 13.3333px; font-style: normal; font-variant-ligatures: normal;
    font-variant-caps: small-caps; font-weight: 400; letter-spacing: normal;
    orphans: 2; text-indent: 0px; text-transform: none; widows: 2; word-spacing:
    0px; -webkit-text-stroke-width: 0px; white-space: normal;
    text-decoration-thickness: initial; text-decoration-style: initial;
    text-decoration-color: initial; text-align: start"><span style="font-family:
    'Sabon LT Std'">Common animals can be as dangerous as any monster, here are
    some examples of beasts heroes might have to face on their ad ventures. The
    GM can easily use them also to represent other, similar animals by slightly
    adjusting their stats or giving them new special abilities.</span></p><p
    style="box-sizing: border-box; user-select: text; margin: 0.5em 0px; color:
    rgb(0, 0, 0); font-family: 'Sabon LT Std'; font-size: 13.3333px; font-style:
    normal; font-variant-ligatures: normal; font-variant-caps: small-caps;
    font-weight: 400; letter-spacing: normal; orphans: 2; text-indent: 0px;
    text-transform: none; widows: 2; word-spacing: 0px;
    -webkit-text-stroke-width: 0px; white-space: normal;
    text-decoration-thickness: initial; text-decoration-style: initial;
    text-decoration-color: initial; text-align: start"><span style="font-family:
    'Sabon LT Std'">Tusked Boars are known for their bad temper. They are
    slightly bigger than a common boar and, as their name suggests, adult males
    grow long, curved tusks, which can easily rip through light armor and, in
    some cases, even chainmail.</span></p><h1 style="box-sizing: border-box;
    user-select: text; margin: 0px 0px 0.5rem; padding: 0px; font-weight:
    normal; font-size: 2em; border-bottom: 2px solid
    var(--color-underline-header); color: rgb(0, 0, 0); font-family: 'Sabon LT
    Std'; font-style: normal; font-variant-ligatures: normal; font-variant-caps:
    small-caps; letter-spacing: normal; orphans: 2; text-align: start;
    text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px;
    -webkit-text-stroke-width: 0px; white-space: normal;
    text-decoration-thickness: initial; text-decoration-style: initial;
    text-decoration-color: initial;"><span style="font-family: 'Sabon LT
    Std'">Combat Tactics</span></h1><p style="box-sizing: border-box;
    user-select: text; margin: 0.5em 0px; color: rgb(0, 0, 0); font-family:
    'Sabon LT Std'; font-size: 13.3333px; font-style: normal;
    font-variant-ligatures: normal; font-variant-caps: small-caps; font-weight:
    400; letter-spacing: normal; orphans: 2; text-indent: 0px; text-transform:
    none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px;
    white-space: normal; text-decoration-thickness: initial;
    text-decoration-style: initial; text-decoration-color: initial; text-align:
    start"><span style="font-family: 'Sabon LT Std'">Animals are driven by
    instinct. Even the most vicious predator will rarely attack large groups,
    and they’ll never fight to the death, unless cornered. Most animals will
    attempt to flee if severely wounded, but some of them (like the Dire Bear
    and the Tusked Boar) will sometimes become dangerously enraged instead, turn
    ing on their aggressors with blind fury.</span></p><h1 style="box-sizing:
    border-box; user-select: text; margin: 0px 0px 0.5rem; padding: 0px;
    font-weight: normal; font-size: 2em; border-bottom: 2px solid
    var(--color-underline-header); color: rgb(0, 0, 0); font-family: 'Sabon LT
