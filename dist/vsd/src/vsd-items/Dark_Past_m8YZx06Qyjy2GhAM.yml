  entries:
    - name: Dark Past
      type: Trait
      system:
        notes: >-
          You once served the Darkmaster or one of His lieutenants, but
          something or someone made you see the errors of your ways. Now you're
          one of His fiercest enemies.

          - Minor (cost 1 BP):  Your familiarity with the ways of the Enemy
          makes it easier for you to see through His ploys. You can cast the
          Sense Darkness Spell once a day without spending MPs or making a Spell
          Casting Roll.

          - Major (cost 3 BPs):  You also gain a special +20 bonus to your
          Wandering Rolls when you're travelling through Darklands or Blighted
          Lands. Additionally, once per session, you may ask the GM to reveal a
          weakness, vulnerability, or idiosyncrasy of a servant of the
          Darkmaster you're facing. Your past misdeeds, however, are hard to
          forget, and many still treat you with suspicion, or even outright
          hostility.
