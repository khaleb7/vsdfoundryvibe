    - name: Keeper of the Hidden Lore
      type: Trait
      system:
        notes: >-
          You're an initiate of a secret magical tradition, or part of an arcane
          organization. Other initiates (and, sometimes, sworn enemies of your
          faction) could recognize you, and may either aid or hinder you,
          depending on the situation.

          - Minor (cost 1 BP):  You gain two ranks in one of your Kin,
          Vocational, or Common Spell Lores (see Magic chapter for more
          information on Spell Lores).

          - Major (cost 3 BPs):  Your training also unlocked a previously
          untapped reserve of magical power stored within you. You gain 1 extra
          MP per Level (including the first). However, the enemies of your
          faction both fear and long for your potential, and will go to great
          lengths to win you over to their cause.
