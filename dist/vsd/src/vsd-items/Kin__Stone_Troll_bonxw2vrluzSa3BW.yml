      system:
        notes: >-
          Sun Cursed: Your kin are blinded by daylight (suffering a -30 penalty
          to all their actions) and immediately turn to stone if exposed to
          direct sunlight. While in this state, they’re essentially stone
          statues: they cannot take Actions and are oblivious to their
          surroundings; they don’t need to breathe and are impervious to most
          attacks. They’re treated as resting for healing purposes, doubling
          their HPs recovery rate. The effects of any form of Bleeding, poison,
          or disease from which they are suffering are temporarily halted. They
          revert to their original state once they’re no longer exposed to
          sunlight.
