    - name: Magical Affinity
      type: Trait
      system:
        notes: >-
          A natural talent and specialized studies made you an expert in a
          particular school of magic.

          - Minor (cost 1 BP):  Choose one of your Vocational Spell Lores to
          become your favorite Spell Lore. You gain a +10 bonus to all Spell
          Casting and Arcana Rolls concerning your favorite Spell Lore.

          - Major (cost 3 BPs):  Additionally, you count as if you were one
          Level higher when casting Spells from your favorite Spell Lore. You
          also gain one additional MP per level, but you can spend these extra
          MPs only to cast Spells from your favorite Spell Lore. However, you
          have a rival who's determined either to discredit you in the academic
          circle or to prove their magic school's superiority to you.
