  entries:
    - name: Rogue Mage
      type: Trait
      system:
        notes: >-
          You were born with an innate magical ability or developed it after a
          unique occurance. You can't really explain why or how your magic
          works, but using it is as natural as breathing to you. 

          - Minor (cost 1 BP):  Include something about your magical ability in
          one of your Passions. Select any one Spell Lore of your choosing and
          add it to your Kin Spell Lores (see Magic chapter for more information
          on Spell Lores).

          - Major (cost 3 BPs):  Additionally, you can spend one point of Drive
          to gain the ability of casting spells from the chosen Spell Lore
          without spending MPs for a scene. At the end of that scene, you become
          Weary if you weren't Weary, and you drop unconscious for 1d10 hours if
          you were. However, you're hunted by a powerful NPC because of your
          powers.
