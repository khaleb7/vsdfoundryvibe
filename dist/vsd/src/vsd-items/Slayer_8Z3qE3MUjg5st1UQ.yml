  entries:
    - name: Slayer
      type: Trait
      system:
        notes: >-
          You have sworn an oath of eternal enmity towards a particular enemy.
          You have spent a great part of your life studying them, to find better
          ways to hunt them.

          - Minor (cost 1 BP):  Pick a specific type of creature (like dragons,
          dwergars, or trolls) as your hated enemy, and write one of your
          Passions about your hatred toward them. You gain a +10 bonus to your
          Hunting, Cultures, Songs & Tales, and Attack Rolls when your hated
          enemy is involved. You cannot choose one of your companions' Kin as
          your hated enemy.

          - Major (cost 3 BP):  Additionally, whenever you start a combat
          against your hated enemy or defeat one of your hated enemies in a
          fight, you gain one Hatred Token (use a glass bead or similar marker
          to represent it). You can spend a Hatred Token either to re-roll an
          Attack Roll that targeted a hated enemy or to add your Level to a
          Critical Strike Roll you scored against a hated enemy. Unused Hatred
          Tokens are discarded at the end of each combat.
        chartype: CharacterVsD
        category: quirk
