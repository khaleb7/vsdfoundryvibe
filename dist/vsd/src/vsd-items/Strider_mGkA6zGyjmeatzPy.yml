  entries:
    - name: Strider
      type: Trait
      system:
        notes: >-
          You lived most of your life in the wilderness, and are accustomed to
          the laws of Nature. You are stigmatised as an 'outsider' by most of
          the civilized people you meet, but you probably don't care.

          - Minor (cost 1 BP):  Write your Nature about why you preferred the
          harshness of the wilds to the comforts of civilization. You gain a +10
          bonus to all your Adventuring Skills while you are outdoors, far from
          civilization. Furthermore, you can travel up to 1.5x the normal
          overland distance per day, as long as you're on foot and Unencumbered
          or Lightly Encumbered.

          - Major (cost 3 BPs):  Additionally, you get a +30 bonus on your Save
          Rolls against Weariness and Starvation, and a +20 bonus to your
          Stealth and Perception Skills while you are out in the wilderness.
        chartype: CharacterVsD
