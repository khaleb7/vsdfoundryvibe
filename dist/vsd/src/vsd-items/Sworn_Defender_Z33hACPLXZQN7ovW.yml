  entries:
    - name: Sworn Defender
      type: Trait
      system:
        notes: >-
          You are part of an elite military order sworn to protect something. It
          could be a place, an item, a person, or even an ideal, such as justice
          or honor. Whatever it is, you've vowed to defend it even at the cost
          of your own life.

          - Minor (cost 1 BP):  Write your Allegiance about your order and its
          mission. You gain one rank in both Armor and Body. You also get a
          special +10 bonus to your Charisma Skill Rolls against people who are
          either part of what your order protects or friendly to their cause.

          - Major (cost 3 BPs):  Additionally, you are immune to fear and gain a
          +15 bonus to your Save Rolls against mind-influencing effects.
        chartype: CharacterVsD
        category: quirk
