pages:
  - name: 2.1 Action Resolution Table
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <table class="actionresolutiontable">

        <tbody>

        <tr class="tableheaderrow">

        <td class="roll">Roll</td>

        <td class="outcome">Outcome</td>

        <td class="resultdescription">Result</td>

        </tr>

        <tr class="tablerow">

        <td class="roll">4 or less</td>

        <td class="outcome">Critical Failure</td>

        <td class="resultdescription">You don’t get what you were trying to
        accomplish and you put yourself in danger, break a piece of equipment,
        take twice the time normally required, or grant your foes a +20 bonus to
        their next Roll against you</td>

        </tr>

        <tr class="tablerow">

        <td class="roll">05-74</td>

        <td class="outcome">Failure</td>

        <td class="resultdescription">You don’t get what you were trying to
        accomplish.</td>

        </tr>

        <tr class="tablerow">

        <td class="roll">75-99</td>

        <td class="outcome">Partial Success</td>

        <td class="resultdescription">You only partially accomplish what you
        were trying to do, or manage to do it but with a cost, complication, or
        trouble.</td>

        </tr>

        <tr class="tablerow">

        <td class="roll">100-174</td>

        <td class="outcome">Success</td>

        <td class="resultdescription">You accomplish what you were trying to
        do.</td>

        </tr>

        <tr class="tablerow">

        <td class="roll">175 or more</td>

        <td class="outcome">Outstanding Success</td>

        <td class="resultdescription">You accomplish what you were trying to do
        and you get a +20 bonus to your (or one of your ally’s) next related
        Roll, gain additional information, or take less time than normally
        required to complete your task.</td>

        </tr>

        </tbody>

        </table>
