        Melee and Thrown Weapons Fumble Table" data-roll="76-100"
        data-result="The character must make an Assessment Roll during the next
        Assessment Phase and Takes a Superficial Critical Strike of the
        appropriate type.">Takes a Superficial Critical Strike of the
        appropriate type.</li>

        </ul>

        </td>

        </tr>

        <tr class="tablerow">

        <td class="roll">101-125</td>

        <td class="resultdescription">The character must make an Assessment Roll
        during the next Assessment Phase, and gets to choose two:

