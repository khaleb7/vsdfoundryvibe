        data-result="The character must make an Assessment Roll during the next
        Assessment Phase and Takes a Light Critical Strike of the appropriate
        type.">Takes a Light Critical Strike of the appropriate type.</li>

        <li class="rollable" data-type="meleethrownfumble" data-table="2.42
        Melee and Thrown Weapons Fumble Table" data-roll="101-125"
        data-result="The character must make an Assessment Roll during the next
        Assessment Phase and Inflicts a Superficial Critical Strike upon a
        nearby ally (if applicable).">Inflicts a Superficial Critical Strike
        upon a nearby ally (if applicable).</li>

        </ul>

        </td>

        </tr>

        <tr class="tablerow">

        <td class="roll">126-150</td>

        <td class="resultdescription">The character is Stunned and gets to
        choose two:

