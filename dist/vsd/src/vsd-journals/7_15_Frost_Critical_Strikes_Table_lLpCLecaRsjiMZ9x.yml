        actions.</td>

        </tr>

        <tr class="tablerow rollable max-moderate" data-type="critical"
        data-table="7.15 Frost Critical Strikes Table" data-roll="120"
        data-result="Frozen blast to the face. If the target is wearing heavy
        headwear: Stunned, -20 to all actions, 2 Bleed, and +12 Damage.
