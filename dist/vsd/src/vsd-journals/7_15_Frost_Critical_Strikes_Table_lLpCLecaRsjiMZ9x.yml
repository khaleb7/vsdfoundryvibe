        data-hits1="10" data-bleed1="0" data-action1="0" data-effect1="stun,
        prone" data-hits2="10" data-bleed2="0" data-action2="40"
        data-effect2="crippled leg">

        <td class="roll">101-106</td>

        <td class="resultdescription">Leg blast +10 Damage, target is knocked
        Prone and Stunned. If no leg armor or heavy clothing: frostbite makes
        leg useless; -40 to all actions.</td>

        </tr>

