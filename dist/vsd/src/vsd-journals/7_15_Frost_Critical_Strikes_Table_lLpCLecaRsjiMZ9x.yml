        the side of the head. If the target is wearing heavy clothing or armor:
        Stunned, +8 Damage, -10 to all actions. Otherwise: ear frozen,+12
        Damage, target is at a permanent -50 to hearing Perception and -20 all
        other Perception Rolls." data-woundtitle="Head Blast"
        data-condition="heavy clothing or armor" data-hits1="8" data-bleed1="0"
        data-action1="10" data-effect1="stun" data-hits2="12" data-bleed2="0"
        data-action2="10" data-effect2="stun, crippled ear">

        <td class="roll">107-109</td>

        <td class="resultdescription">Blast to the side of the head. If the
        target is wearing heavy clothing or armor: Stunned, +8 Damage, -10 to
        all actions. Otherwise: ear frozen,+12 Damage, target is at a permanent
        -50 to hearing Perception and -20 all other Perception Rolls.</td>

        </tr>

        <tr class="tablerow rollable max-light" data-type="critical"
        data-table="7.15 Frost Critical Strikes Table" data-roll="110"
        data-result="Blast to the rear of the head and neck. If the target's
        neck is covered by heavy clothing: Stunned, +8 Damage and 2 Bleed. If
        not: target is in coma for 3 weeks and paralyzed from the neck down when
        waking up." data-woundtitle="Neck Blast" data-condition="heavy neck
        clothing" data-hits1="8" data-bleed1="2" data-action1="0"
        data-effect1="stun" data-hits2="8" data-bleed2="2" data-action2="0"
        data-effect2="unconscious[3 wk], crippled paralyzed">

        <td class="roll">110</td>

        <td class="resultdescription">Blast to the rear of the head and neck. If
        the target's neck is covered by heavy clothing: Stunned, +8 Damage and 2
        Bleed. If not: target is in coma for 3 weeks and paralyzed from the neck
        down when waking up.</td>

        </tr>

        <tr class="tablerow rollable" data-type="critical" data-table="7.15
