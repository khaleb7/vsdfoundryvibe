        data-condition="successful TSR:AL10" data-hits1="15" data-bleed1="0"
        data-action1="0" data-effect1="stun" data-hits2="15" data-bleed2="0"
        data-action2="0" data-effect2="stun, death[6]">

        <td class="roll">127-129</td>

        <td class="resultdescription">Target inhales freezing fluid. +15 Damage
