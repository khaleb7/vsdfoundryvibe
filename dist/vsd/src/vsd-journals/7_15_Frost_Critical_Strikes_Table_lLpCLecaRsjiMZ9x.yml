        failure.</td>

        </tr>

        <tr class="tablerow rollable" data-type="critical" data-table="7.15
        Frost Critical Strikes Table" data-roll="137-140" data-result="Target
        engulfed in frost begins to feel really cold. If wearing heavy armor and
        clothing: +20 Damage, Stunned and -30 to all actions. If not, dies in 12
