        data-bleed1="0" data-action1="0" data-effect1="death" data-hits2="0"
        data-bleed2="0" data-action2="0" data-effect2="null">

        <td class="roll">147-149</td>

        <td class="resultdescription">Target's head is frozen. Well preserved,
