        into a coma." data-woundtitle="Face Blast" data-condition="heavy
        headwear" data-hits1="12" data-bleed1="2" data-action1="20"
        data-effect1="null" data-hits2="12" data-bleed2="2" data-action2="20"
        data-effect2="blind, crippled eyes, unconscious">

        <td class="roll">120</td>

        <td class="resultdescription">Frozen blast to the face. If the target is
        wearing heavy headwear: Stunned, -20 to all actions, 2 Bleed, and +12
        Damage. Otherwise: as above but also frozen eyes, target is blinded and
        falls into a coma.</td>

        </tr>

        <tr class="tablerow rollable" data-type="critical" data-table="7.15
        Frost Critical Strikes Table" data-roll="121-126" data-result="Blast to
        the arm (1d10: 1-5 left, 6-10 right). If the target is wearing heavy
        clothes or armor: drops anything held, Stunned, +10 Damage,and 3 Bleed.
        If not: arm frozen and shattered, target falls unconscious, and arm
        useless (-50 to all actions)." data-woundtitle="Arm Blast"
        data-condition="heavy clothing or armor" data-hits1="10" data-bleed1="3"
        data-action1="0" data-effect1="stun, drop item" data-hits2="10"
        data-bleed2="3" data-action2="50" data-effect2="stun, drop item,
        crippled arm, unconscious">

        <td class="roll">121-126</td>

        <td class="resultdescription">Blast to the arm (1d10: 1-5 left, 6-10
