        <td class="resultdescription">Cold blast: +3 Damage. If the target is
        not wearing a cloak or heavy clothing: +6 Damage and Stunned.</td>

        </tr>

        <tr class="tablerow rollable" data-type="critical" data-table="7.15
        Frost Critical Strikes Table" data-roll="21-35" data-result="Frostbite
        burn. +7 Damage, 1 Bleed." data-woundtitle="Frostbite Burn"
