        data-hits1="0" data-bleed1="2" data-action1="0" data-effect1="stun,
        prone" data-hits2="13" data-bleed2="2" data-action2="40"
        data-effect2="cripple leg">

        <td class="roll">111-116</td>

        <td class="resultdescription">Icy thigh strike. If the target is wearing
