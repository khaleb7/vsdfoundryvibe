        <td class="resultdescription">Frostbite burn. +7 Damage, 1 Bleed.</td>

        </tr>

        <tr class="tablerow rollable" data-type="critical" data-table="7.15
        Frost Critical Strikes Table" data-roll="36-50" data-result="Frost
        strike to the upper torso, +5 Damage. If the target is not wearing heavy
        clothes, also 2 Bleed and -10 to all actions." data-woundtitle="Torso
        Strike" data-condition="heavy clothing" data-hits1="5" data-bleed1="0"
        data-action1="0" data-effect1="null" data-hits2="5" data-bleed2="2"
        data-action2="10" data-effect2="null">

        <td class="roll">36-50</td>

        <td class="resultdescription">Frost strike to the upper torso, +5
