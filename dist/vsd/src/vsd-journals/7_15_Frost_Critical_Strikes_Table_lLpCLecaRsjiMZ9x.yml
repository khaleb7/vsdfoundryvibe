        to the pelvis. If the target is wearing armor or heavy clothing: +3
        Damage. Otherwise: frozen groin; +12 Damage, Stunned, and target is
        sterilised." data-woundtitle="Frozen Pelvis" data-condition="armor or
        heavy clothing" data-hits1="3" data-bleed1="0" data-action1="0"
        data-effect1="null" data-hits2="12" data-bleed2="0" data-action2="0"
        data-effect2="stun, crippled groin">

        <td class="roll">66-79</td>

        <td class="resultdescription">Frostbite to the pelvis. If the target is
        wearing armor or heavy clothing: +3 Damage. Otherwise: frozen groin; +12
        Damage, Stunned, and target is sterilised.</td>

        </tr>

        <tr class="tablerow rollable" data-type="critical" data-table="7.15
        Frost Critical Strikes Table" data-roll="80-89" data-result="Frost
        strike to the back. Target is thrown to the ground, disarmed. Stunned
        and +10 Damage." data-woundtitle="Back Strike" data-condition="null"
        data-hits1="10" data-bleed1="0" data-action1="0" data-effect1="stun,
        prone, drop weapon" data-hits2="0" data-bleed2="0" data-action2="0"
        data-effect2="null">

        <td class="roll">80-89</td>

        <td class="resultdescription">Frost strike to the back. Target is thrown
        to the ground, disarmed. Stunned and +10 Damage.</td>

        </tr>

        <tr class="tablerow rollable" data-type="critical" data-table="7.15
        Frost Critical Strikes Table" data-roll="90-99" data-result="Blast to
        the hands (1d10: 1-4 left, 5-8 right, 9-10 both). If the target is
        wearing gloves: disarmed and +8 Damage. Otherwise: hand(s)frozen, loses
        1d5 (or 1d10) fingers: -5 to all actions for each finger lost."
        data-woundtitle="Hands Blast" data-condition="gloves" data-hits1="8"
        data-bleed1="0" data-action1="0" data-effect1="drop weapon"
        data-hits2="0" data-bleed2="0" data-action2="25" data-effect2="crippled
        fingers">

        <td class="roll">90-99</td>

        <td class="resultdescription">Blast to the hands (1d10: 1-4 left, 5-8
        right, 9-10 both). If the target is wearing gloves: disarmed and +8
        Damage. Otherwise: hand(s)frozen, loses 1d5 (or 1d10) fingers: -5 to all
        actions for each finger lost.</td>

        </tr>

        <tr class="tablerow rollable max-superficial" data-type="critical"
        data-table="7.15 Frost Critical Strikes Table" data-roll="100"
        data-result="Icy blast to the head. If the target is wearing furs or
        heavy head clothing: Stunned, +10 Damage. If not, target falls into a
        month-long coma and loses nose as a result of severe frostbite."
        data-woundtitle="Head Blast" data-condition="furs or heavy clothing"
        data-hits1="10" data-bleed1="0" data-action1="0" data-effect1="stun"
        data-hits2="10" data-bleed2="0" data-action2="0"
        data-effect2="unconscious[1 mon], crippled nose">

        <td class="roll">100</td>

        <td class="resultdescription">Icy blast to the head. If the target is
        wearing furs or heavy head clothing: Stunned, +10 Damage. If not, target
        falls into a month-long coma and loses nose as a result of severe
        frostbite.</td>

        </tr>

        <tr class="tablerow rollable" data-type="critical" data-table="7.15
