        </tr>

        <tr class="tablerow rollable" data-type="critical" data-table="7.15
        Frost Critical Strikes Table" data-roll="06-20" data-result="Cold blast:
        +3 Damage. If the target is not wearing a cloak or heavy clothing: +6
        Damage and Stunned." data-woundtitle="Cold Blast" data-condition="cloak
        or heavy clothing" data-hits1="0" data-bleed1="0" data-action1="0"
