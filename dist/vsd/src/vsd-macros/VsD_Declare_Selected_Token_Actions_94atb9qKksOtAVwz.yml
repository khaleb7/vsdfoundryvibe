name: VsD Declare Selected Token Actions
type: script
author: cwpZyEuSkQ36r9mu
img: icons/svg/combat.svg
scope: global
command: |-
  const buttondata = CONFIG.system.combat;

  const buttons = {};
  for (const button of buttondata) {
      buttons[button.action] = {
          label: button.action,
          callback: () => {
              label = button.action,
              init = button.initiative,
              d.render(true)
          }
      }
  }

  let d = new Dialog({
      title: `Set Action Declaration`,
      buttons: buttons,
      close: async html => {
          if (label) {
              const tokens = canvas.tokens.controlled;
              for (const token of tokens) {
                  if (token.inCombat) {
                      token.combatant.update({ ["flags.vsd.action"]: label, initiative: Number(init) });
                      // token.combatant.actor.setFlag("vsd", "action", label);
                  }
              }
              label = "", init = 0;
          }
      }
  },
      {
          width: 200,
          classes: ["mydialog"],
          top: 0,
          left: 0
      });
  d.render(true);
flags:
  furnace:
    runAsGM: true
  core: {}
