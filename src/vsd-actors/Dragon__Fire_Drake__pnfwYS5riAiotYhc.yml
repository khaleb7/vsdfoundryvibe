  biography: "<h1>Unique Dragon Ability Table</h1><table style=\"width: 99.3228%; height: 160px;\" border=\"1\"><tbody><tr style=\"height: 16px;\"><td style=\"width: 8.06954%; height: 16px;\"><p>01-10</p></td><td style=\"width: 91.3624%; height: 16px;\"><p><strong>Soft Spot: </strong>The Dragon has a soft spot in its armor. If learned, heroes can target it (attacking at a -30) to treat the Dragon’s armor as No Armor.</p></td></tr><tr style=\"height: 16px;\"><td style=\"width: 8.06954%; height: 16px;\"><p>11-20</p></td><td style=\"width: 91.3624%; height: 16px;\"><p><strong>Death Curse:</strong> If the Dragon is slain, it can lay a terrible curse on its slayer.</p></td></tr><tr style=\"height: 16px;\"><td style=\"width: 8.06954%; height: 16px;\"><p>21-30</p></td><td style=\"width: 91.3624%; height: 16px;\"><p><strong>Acidic Blood: </strong>The Dragon’s blood is corrosive, dealing a Light Fire Critical Strike to anyone who hits it in melee with an edged or puncturing weapon.</p></td></tr><tr style=\"height: 16px;\"><td style=\"width: 8.06954%; height: 16px;\"><p>31-40</p></td><td style=\"width: 91.3624%; height: 16px;\"><p><strong>Eldritch Power:</strong> The Dragon knows 1d5 Spell Lores, and can cast Spells from them without using MPs (use its Lore bonus for the Spell Casting Roll).</p></td></tr><tr style=\"height: 16px;\"><td style=\"width: 8.06954%; height: 16px;\"><p>41-50</p></td><td style=\"width: 91.3624%; height: 16px;\"><p><strong>Transfixing Gaze:</strong> The Dragon has the ability to paralyze with its gaze. It can target one creature each Round with its gaze as a Free Action. Targeted creatures must pass a WSR or be Held until the Dragon shifts its gaze to another target. Creatures who cannot see are immune to this effect.</p></td></tr><tr style=\"height: 16px;\"><td style=\"width: 8.06954%; height: 16px;\"><p>51-60</p></td><td style=\"width: 91.3624%; height: 16px;\"><p><strong>Unusual Movement:</strong> The Dragon gains one of the following movements: winged flight (MR 55F), burrowing through earth MR 18L), or swimming (MR 25S).</p></td></tr><tr style=\"height: 16px;\"><td style=\"width: 8.06954%; height: 16px;\"><p>61-70</p></td><td style=\"width: 91.3624%; height: 16px;\"><p><strong>Invulnerable:</strong> The Dragon cannot be hurt by mundane or magical attacks, unless it has been hit by a specific Special Herb first.</p></td></tr><tr style=\"height: 16px;\"><td style=\"width: 8.06954%; height: 16px;\"><p>71-80</p></td><td style=\"width: 91.3624%; height: 16px;\"><p><strong>Many-Headed:</strong> The Dragon has an additional head and can make two Bite attacks each Round. If it has a Breath attack, it can use it with one head while the other bites. Each head counts as a different target for mind-influencing Spells and effects and both heads must be Stunned for the Dragon to be Stunned.</p></td></tr><tr style=\"height: 16px;\"><td style=\"width: 8.06954%; height: 16px;\"><p>81-90</p></td><td style=\"width: 91.3624%; height: 16px;\"><p>Choose Two Abilities from this table.</p></td></tr><tr style=\"height: 16px;\"><td style=\"width: 8.06954%; height: 16px;\"><p>91-00</p></td><td style=\"width: 91.3624%; height: 16px;\"><p>Choose Three Abilities from this table.</p></td></tr></tbody></table><h1>Description</h1><p>Dragons are the stuff of legend; few other creatures inspire the same level of awe and terror, and fewer still would even think of challenging one.</p><p>Their origins are shrouded in mystery; a mystery that puzzles sages and philosophers of all Kins to this day. Some say they are shards of the Primordial Chaos that somehow crept into the world at the beginning of time. Others that they were created by the Darkmaster as the ultimate weapon but quickly grew too proud and powerful even for Him and escaped His control. Others yet that they are magic incarnate given form by the deepest fears and the basest thoughts of all Kins.</p><p>One thing is certain: the number of Dragons is dwindling. Very few survive to this day, and even their power is much diminished compared to those who lived in the past Ages. This doesn’t make them less fearsome, though. They may be weaklings compared to the Elder Dragons of legend, but even the smallest Dragon youngling is a formidable foe, capable of taking on a small army all by itself.</p><p>Huge winged beasts, capable of incinerating their foes with their scalding fire breaths, Fire Drakes are what most people think about when they talk about Dragons. Known for their cunning, cruelty and, most of all, for their insatiable greed, Fire Drakes love to gather massive amounts of wealth; veritable mountains of gold, silver, and jewels, upon which they lie to slumber, even for years at times.</p><p>Countless fools, drawn by the promise of riches and fame, have tried to sneak into their den, only to find that, even in their sleep, Dragons are always vigilant. Most of the times, these poor souls meet a quick and fiery end. In some occasions, however, Fire Drakes amuse themselves by keeping them as prisoners or slaves, until they grow tired of their new toy and devour them.</p><h1>Combat Tactics</h1><p>Dragons are one of the deadliest foes heroes can face. Capable of overpowering most opponents through their sheer might, Dragons can also count on the supernatural hardness of the scales covering their bodies and on a host of special abilities. In addition, most Dragons are highly intelligent and know their territory like the back of their claws.</p><p>To stand a chance against them, dragon hunters will have to exploit their quirks and weaknesses, using their vanity, greed, and bloodlust against them. They had better be sure of what they’re doing, though. Angering a dragon is not a mistake that can be done twice.\_</p><h1>Stat Block</h1><ul><li>Name: Fire Drake</li><li>Type: Dragon</li><li>Description: Dragons are the stuff of legend; few other creatures inspire the same level of awe and terror, and fewer still would even think of challenging one.</li><li>Level: 25 Antagonist</li><li>MoveRate: 55F or 18L</li><li>ArmourType: HE</li><li>Defence: 40</li><li>Toughness: 125</li><li>Willpower: 125</li><li>HitPoints: 450</li><li>Attack: 175 ### Colossal ### Bite</li><li>Attack: 150 ### Huge ### Claw</li><li>Attack:\_ ###\_ ###\_</li><li>Special: Terrifying Presence, Elemental Resistance, Draconic Might, Heightened Senses, Ferocity, Overwhelming, Dragon’s Breath</li><li>CreatureType: EB</li><li>Roguery: 120</li><li>Adventuring: 110</li><li>Lore: 100</li><li>Source: Core Rules p290\_</li></ul>"
