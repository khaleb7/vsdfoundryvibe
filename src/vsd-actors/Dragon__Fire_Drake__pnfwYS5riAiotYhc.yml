  - name: Antagonist
    type: Trait
    system:
      notes: >-
        Antagonists that have a valid reason will fight to the death. The GM
        should dive into the NPC’s motivations and personality. An ancient
        dragon, for example, probably won’t fight to the death unless really
        angered, if it has any other choice - because it feels its life is more
        precious and important than pride most of the times. On the other hand,
        a Wight or another Undead creature will carry on until its own
        annihilation. Why fear Death when you’ve already returned from it once?
