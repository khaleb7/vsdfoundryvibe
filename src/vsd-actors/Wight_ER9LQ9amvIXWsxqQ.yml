  adminMode: false
  biography: "<h1>Weapon(s)</h1><p>Drag your choice of a melee weapon or two and a missile weapon to the character.</p><h1>Description</h1><p>Wights are the tortured spirits of great warriors who dared to oppose the Darkmaster but ultimately fell to the forces of Darkness. To punish them for their temerity, the Darkmaster turned them into vile undead abominations, trapping their consciousness in a perpetual nightmare from which they cannot awake. They haunt blighted lands and old burial places, like barrows, mounds, or ancient necropoli; their madness and despair slowly poisoning the land around their grave, draining it of all life.</p><h1>Combat Tactics</h1><p>Wights combine martial prowess with a supernatural resilience, but what makes them truly terrifying is their ability to ensorcell the mind of the living. They’ll always start the fight with their Call of the Grave ability, attempting to get as many opponents as possible before the actual combat begins. Those who fall prey to their power are dragged to the Wight’s tomb, to be used in foul rituals as sacrifices to the Darkmaster.</p><h1>Stat Block</h1><ul><li>Name: Wight</li><li>Type: Wight</li><li>Description: Wights are the tortured spirits of great warriors who dared to oppose the Darkmaster but ultimately fell to the forces of Darkness.</li><li>Level: 10 Elite</li><li>MoveRate: 15L</li><li>ArmourType: NA</li><li>Defence: 50</li><li>Toughness: 80</li><li>Willpower: 90</li><li>HitPoints: 100</li><li>Attack: 105 ###\_ ### Weapon</li><li>Special: Unliving, Darkvision, Sun Sensitivity, Corrupting Presence, Call of the Grave, Unholy Drain, Undying</li><li>CreatureType: HH</li><li>Roguery: 40</li><li>Adventuring: 30</li><li>Lore: 40</li><li>Source: Core Rules p338</li></ul>"
