  - name: Call of the Grave
    type: Trait
    system:
      notes: >-
        Using dreadful spells and incantations, Wights can attempt to drag other
        living beings into the nightmare tormenting them. By spending a Full
        Action they can force a living creature they see to make a WSR or fall
        into a deep, troubled sleep for 1 hour for every 10 points of failure.
        Prodding or harming the sleeping characters will not awaken them, but
        the effects of this ability can be dispelled by magic or by exposing its
        victims to direct sunlight.


        Creatures who pass the WSR become immune to the effects of this ability
        for the rest of the fight.
