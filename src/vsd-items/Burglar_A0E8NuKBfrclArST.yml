  entries:
    - name: Burglar
      type: Trait
      system:
        notes: >-
          You are trained as a professional burglar, or expert treasure-hunter,
          if you prefer. Your services are usually sought by those who'd like to
          acquire precious (and often carefully guarded) items with a certain
          discretion.

          - Minor (cost 1 BP):  You gain one rank in Stealth and one rank in
          Locks & Traps. Additionally, you can always eyeball the approximate
          value of any precious item you see, even with a single glance.

          - Major (3 BPs):  Moreover, whenever you attack an opponent
          bare-handed or using a Hand weapon, you may use a Free Action to make
          a Stealth Roll. If you succeed, you may pilfer a non-fixed small item
          within your reach, as long as no one is holding or wielding it.
          However, you've stolen something from someone, and now they'll be
          hunting you to get it back.
