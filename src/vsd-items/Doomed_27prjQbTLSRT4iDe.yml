system:
  notes: >-
    Doomed: Because of the Darkmaster’s curse, all of your Kin have an
    additional Passion called Doom. Players must generate their character’s Doom
    by rolling on the Doom Table [p42]. Doom works exactly like any other
    Passion, but cannot be changed unless the Darkmaster is defeated. When
    facing a situation concerning their Doom, your Kin suffer a -20 penalty to
    all their Rolls and add 20 to the result of any Critical Strike they
    receive.
