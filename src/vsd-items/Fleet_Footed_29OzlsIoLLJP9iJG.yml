        notes: >-
          You move like the wind, leaving everyone else behind you. When you
          run, you can truly show them the meaning of haste.

          - Minor (cost 1 BP):  Increase your Move Rate by 5 meters. You can
          travel up to 1.5x the normal overland distance per day, as long as
          you're on foot and Unencumbered or Lightly Encumbered.

