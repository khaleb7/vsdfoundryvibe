  entries:
    - name: Healer's Hands
      type: Trait
      system:
        notes: >-
          Some heroes are known for their might in battle, but you know that
          even a greater strength is required to mend what's broken. Yours are
          the hands of a healer, casting a pure light in a world besieged by
          Shadow. 

          - Minor (cost 1 BP):  You gain a special +10 bonus to your Healer
          Skill, and a +10 bonus to your Nature Skill Rolls to find healing
          herbs.

          - Major (cost 3 BPs):  Additionally, whenever you treat one of your
          companions or administer them a healing herb, you may choose one of
          the following options:  have the patient recover a number of HPs equal
          to your ranks in the Healer Skill (not your Skill bonus); grant them a
          special bonus to a SR made to resist the effects of a disease or
          poison equal to double your number of ranks in the Healer Skill;
          reduce the recovery time of a treated Injury by one day for every 5
          ranks you have in the Healer Skill.
        chartype: CharacterVsD
        category: quirk
