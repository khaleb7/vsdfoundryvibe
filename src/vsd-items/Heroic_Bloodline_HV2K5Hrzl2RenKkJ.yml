  entries:
    - name: Heroic Bloodline
      type: Trait
      system:
        notes: >-
          The blood of heroes runs strongly in your veins. Tales are sung about
          the mighty deeds of your family, of your ancestors. Now these tales
          live again, through you.

          - Minor (cost 1 BP):  You can take a Half Action to inspire all the
          allies that can hear you within a radius of 6 meters, granting them a
          special bonus of +10 to their Willpower Save Rolls, or a special +5
          bonus to their Attack Bonus and Defense for the current Round. 

          - Major (cost 3 BPs):  You can also reveal your ancestry to someone
          who doesn't know it as a Free Action. When you reveal yourself to
          someone, you can either gain a +10 bonus to your Attack Rolls against
          them for the current Round, or get to re-roll a Charisma or Deceive
          Roll against them with a +20 bonus.
        chartype: CharacterVsD
        category: quirk
