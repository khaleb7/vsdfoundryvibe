  entries:
    - name: Loremaster
      type: Trait
      system:
        notes: >-
          You are a scholar, a chronicler, a sage. You spent years studying the
          history of the world and are always well-informed on anything that
          happens around you.

          - Minor (cost 1 BP):  You gain one rank in either the Songs & Tales or
          the Cultures Skill. Whenever you travel to a place you have never
          visited before in game, you may ask the GM to reveal an interesting
          rumor, piece of lore, or little-known historical fact about your
          destination.

          - Major (cost 3 BPs):  You gain the benefits of the Minor Tier.
          Additionally, choose a specific field of knowledge, such as Dwarven
          history or Elvish runes. Treat all Failure results you score in Songs
          & Tales or Cultures Skill Rolls concerning the field of knowledge
          you've chosen as if they were Partial Success results (Critical
          Failure results are not influenced by this ability).
