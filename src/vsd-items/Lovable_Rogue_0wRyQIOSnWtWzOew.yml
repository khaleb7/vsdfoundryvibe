    - name: Lovable Rogue
      type: Trait
      system:
        notes: >-
          You are a scoundrel, a crook, a liar, a ne'er-do-well. By all reasons,
          no one should like you, and yet people tend to find you unexplainably
          charming.

          - Minor (cost 1 BP):  Write what makes you unreliable yet likable in
          your Nature, and increase the total value of either your Wits or your
          Bearing by 5 points.

          - Major (cost 3 BPs):  Additionally, once per session, you can attempt
          to confuse a group of sentient beings with your outrageous behaviour
          as a Full Action. Your targets must be able to see and hear you, and
          cannot be engaged in combat for this ability to work. Describe your
          act and make a Conflicting Action Roll, using your Deceive Skill
          against their Perception Skill. If you win, your targets are Stunned
          and will be distracted by your actions until you stop or something
          else catches their attention.
