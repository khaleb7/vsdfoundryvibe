  entries:
    - name: Religious Adept
      type: Trait
      system:
        notes: >-
          You are a member of an established religious order:  either of the
          clergy of some god's church or some cult.

          - Minor (cost 1 BP):  You are an initiate adept of the cult/church.
          You always carry with you a holy symbol that identifies you as a
          member of your cult or church. Write your Nature or Allegiance to
          reflect either your religious creed or your loyalty to your
          cult/church. Other members of the church or cult will try to help you
          in times of need, giving you protection and shelter. You also gain a
          special +20 bonus to all Charisma and Deceive Rolls made against other
          followers of your belief.

          - Major (3 BPs):  You are a member of the clergy, a 'true priest'. In
          addition to the benefits of the Minor Tier, choose a non-attack Spell
          of the Fifth Weave or less that doesn't require a Save Roll related to
          your belief. You can cast the chosen Spell once per day without
          spending MPs or making a Spell Casting Roll. Initiates and adepts of
          your cult/church will listen to your words and obey your provisions.
          However, you are disliked by the clergy and members of an opposing
          cult or church.
        chartype: CharacterVsD
        category: quirk
