  entries:
    - name: Stormcrow
      type: Trait
      system:
        notes: >-
          You are cursed with a peculiar ability. You see glimpses of the
          future, now and then, but your visions only show you sorrow, failure,
          pain, and death. Your associates rarely listen to your counsel,
          calling you a doomsayer and a bird of ill-omen. But you know what's
          coming and prepare for the worst.

          - Minor (cost 1 BP):  Write one of your Passions about your visions,
          and increase the total value of your Wisdom by 5 points.

          - Major (cost 3 BPs):  Additionally, whenever one of your allies
          spends a point of Drive to re-roll a failed Skill or Save Roll and
          fails again, you may spend a Free Action to have a vision of doom.
          When you do so, your companion may accept the failure and get the
          point of Drive they just spent back.
