  entries:
    - name: Unbreakable Bond
      type: Trait
      system:
        notes: >-
          The road may be dark before you, but you're not alone to face it. You
          formed a strong bond with another member of your fellowship. Together,
          you can overcome any adversity.

          - Minor (cost 1 BP):  Select one of your companions and write your
          Allegiance about them. You gain a +10 bonus to your Rolls made to Help
          the chosen character. Moreover, you always know when your chosen
          companion is in danger, even if you aren't able to see each other or
          are separated by a great distance.

          - Major (cost 3 BPs):  Additionally, as long as you and the chosen
          companion are within sight of each other, both of you gain a +5 bonus
          to your DEF and Save Rolls.
        chartype: CharacterVsD
        category: quirk
