    - name: Unorthodox Education
      type: Trait
      system:
        notes: >-
          You started learning the ropes of a different Vocation than the one
          you belong to now, but either soon discovered that it wasn't your
          calling or were somehow forced to interrupt your training. 

          - Minor (cost 1 BP):  Choose a Skill in which you have no Vocational
          Bonuses. You gain a special +10 bonus to that Skill.

          - Major (cost 3 BPs):  Additionally, choose a Vocation different than
          yours and a Skill Category in which that Vocation gets at least 2 DPs
          each Level. At each Level, you get one less Development Point to spend
          in the Skill Category your Vocation gets the most DPs (choose one when
          you select this Option if more Categories get the same number of DPs),
          and one additional Development Point to spend in the chosen category
          for the other Vocation. However, you gained the enmity of a powerful
          individual during your training. Name your enemy and write your
          Allegiance about them. For example, if you are a Wizard and chose the
          Warrior Vocation and the Body Skill Category, at each Level you gain
          one less DP in either the Lore or the Spells Category, and one extra
          DP in Body.
