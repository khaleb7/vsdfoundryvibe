  entries:
    - name: Well Traveled
      type: Trait
      system:
        notes: >-
          You travelled far and wide, and are familiar with many places and ways
          unknown to the majority of people.

          - Minor (cost 1 BP):  You gain one rank in Wandering and you know the
          location of a Safe Haven. Once during the game, unless your character
          is in the Darklands, you can declare that a Safe Haven is near, and
          mark it on the map within 1d5 days of travel from your character's
          position. Once you've done this, you lose this ability, but the Safe
          Haven remains available to you and your companions.

          - Major (cost 3 BPs):  Additionally, once per session when your party
          is Preparing for Travel, you may ask the GM to reveal an alternative,
          secret, or rarely used route to your destination, without any Skill
          Roll.
