      content: "<table class=\"spellcastingtable\">\n<tbody>\n<tr class=\"tableheaderrow\">\n<td class=\"roll\">Roll</td>\n<td class=\"result\">Target Number</td>\n<td class=\"outcomeeffects\">Outcome &amp; Additional Effects</td>\n</tr>\n<tr class=\"tablerow rollable\" data-type=\"spellcasting\" data-table=\"2.6 Spell Casting Table\" data-roll=\"up to 25\" data-result=\"Spell Failure: Roll on the Critical Spell Failure Table\">\n<td class=\"roll\">up to 25</td>\n<td class=\"result\">-</td>\n<td class=\"outcomeeffects\">Spell Failure: Roll on the Critical Spell Failure Table</td>\n</tr>\n<tr class=\"tablerow\">\n<td class=\"roll\">26-50</td>\n<td class=\"result\">-</td>\n<td class=\"outcomeeffects\">Partial Success: Choose the one that applies best:\n<ul>\n<li class=\"rollable\" data-type=\"spellcasting\" data-table=\"2.6 Spell Casting Table\" data-roll=\"26-50\" data-result=\"Partial Success: The target automatically succeeds at their Save Roll if one was required.\">The target automatically succeeds at their Save Roll if one was required.</li>\n<li class=\"rollable\" data-type=\"spellcasting\" data-table=\"2.6 Spell Casting Table\" data-roll=\"26-50\" data-result=\"Partial Success: The spell duration is reduced to half the original duration (rounded down).\">The spell duration is reduced to half the original duration (rounded down).</li>\n<li class=\"rollable\" data-type=\"spellcasting\" data-table=\"2.6 Spell Casting Table\" data-roll=\"26-50\" data-result=\"Partial Success: The spell area of effect is reduced to half the original area (rounded down).\">The spell area of effect is reduced to half the original area (rounded down).</li>\n<li class=\"rollable\" data-type=\"spellcasting\" data-table=\"2.6 Spell Casting Table\" data-roll=\"26-50\" data-result=\"Partial Success: The spell has no effect, but the caster retains the Magic Points.\">The spell has no effect, but the caster retains the Magic Points.</li>\n</ul>\n</td>\n</tr>\n<tr class=\"tablerow\">\n<td col