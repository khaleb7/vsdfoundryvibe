command: |-
  /**
   * Change the folderName to the items folder from which you want
   * to copy the contents onto your selected token actor.
   */

  main()
  async function main() {
      const folderName = "dummy folder";
      const actorLink = true;

      const folderId = game.collections.get("Folder").getName(folderName).id;
      const actors = game.collections.get("Actor").filter(function (actor) {
          return actor.folder?.id == folderId;
      });
      console.log("Folder Contents: ", actors);

      actors.forEach(async function (actor) {
          const actordata = actor.system;
          await actor.update({"prototypeToken.actorLink" : actorLink});
          console.log("Actor Link", actor.prototypeToken.actorLink);
      });
  }
